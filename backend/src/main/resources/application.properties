# ============================================================
# Virtual Plant Care Management System
# Spring Boot Application Configuration
# ============================================================

spring.application.name=virtual-plant-care
server.port=8080

# ============================================================
# Supabase PostgreSQL Database Configuration
# Values are read from environment variables — never hardcoded.
# Set these variables before starting the backend.
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP — default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# JPA / Hibernate Configuration
# SAFE settings — do NOT use create-drop or create in production
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Suppress Hibernate warning about lazy loading proxy
spring.jpa.open-in-view=false

# Jackson date serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.plantcare=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO
